<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us - Catalysta Consultancy</title>
<link rel="stylesheet" href="../CSS/styles.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===================== NAVBAR ===================== -->
<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo" aria-label="Catalysta home">
      <img src="../assets/logo.png" alt="Catalysta consultancy logo" class="brand-logo">
    </a>
    <nav class="main-nav">
      <a href="index.html#home">Home</a>
      <a href="about.html" class="active" aria-current="page">About us</a>
      <a href="services.html">Services</a>
      <a href="blogs.html">Blogs</a>
    </nav>
    <a href="contact.html" class="btn btn-pill btn-accent nav-cta">Get in touch</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="loading-content-shell" aria-live="polite" aria-busy="true">
  <div class="loading-content">
    <div aria-label="Orange and tan hamster running in a metal wheel" role="img" class="wheel-and-hamster">
      <div class="wheel"></div>
      <div class="hamster">
        <div class="hamster__body">
          <div class="hamster__head">
            <div class="hamster__ear"></div>
            <div class="hamster__eye"></div>
            <div class="hamster__nose"></div>
          </div>
          <div class="hamster__limb hamster__limb--fr"></div>
          <div class="hamster__limb hamster__limb--fl"></div>
          <div class="hamster__limb hamster__limb--br"></div>
          <div class="hamster__limb hamster__limb--bl"></div>
          <div class="hamster__tail"></div>
        </div>
      </div>
      <div class="spoke"></div>
    </div>
    <p class="loading-text">Loading Content</p>
  </div>
</section>

<!-- ===================== FOOTER ===================== -->
<footer class="site-footer" id="contact">
  <div class="section-inner footer-grid">
    <div class="footer-brand">
      <a href="index.html" class="logo footer-logo" aria-label="Catalysta home">
        <img src="../assets/logo.png" alt="Catalysta consultancy logo" class="brand-logo footer-brand-logo">
      </a>
      <p class="footer-contact">(+63) 995 069 6769</p>
      <p class="footer-contact">PSE Tower, 5th Avenue corner 28th Street, BGC 1634, Taguig, Metro Manila, Philippines</p>
      <div class="footer-social">
        <a href="#" aria-label="Facebook"><img src="../assets/facebook_icon.png" alt=""></a>
        <a href="#" aria-label="Instagram"><img src="../assets/instagram_icon.png" alt=""></a>
        <a href="#" aria-label="X"><img src="../assets/x_icon.png" alt=""></a>
      </div>
    </div>

    <div class="footer-links">
      <h4>Links</h4>
      <a href="index.html#home">Home</a>
      <a href="about.html">About us</a>
      <a href="services.html">Services</a>
      <a href="blogs.html">Blogs</a>
    </div>

    <div class="footer-form">
      <h4>Contact us</h4>
      <form id="contactForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="3" required></textarea>
        <button type="submit" class="btn btn-pill btn-accent">Send <span class="arrow">➤</span></button>
        <p class="form-status" id="formStatus" role="status"></p>
      </form>
    </div>
  </div>
  <div class="footer-bottom">© 2026 Catalysta Consultancy</div>
</footer>

<script src="../JS/script.js"></script>
</body>
</html>
